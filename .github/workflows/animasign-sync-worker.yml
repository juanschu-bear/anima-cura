name: AnimaSign Sync Worker

permissions:
  contents: read
  issues: write

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: animasign-sync-worker
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      IVORIS_APP: ${{ secrets.IVORIS_APP }}
      IVORIS_APP_VERSION: ${{ secrets.IVORIS_APP_VERSION }}
      IVORIS_API_KEY: ${{ secrets.IVORIS_API_KEY }}
      IVORIS_LINKNAME: ${{ secrets.IVORIS_LINKNAME }}
      IVORIS_PROFILE_ID: ${{ secrets.IVORIS_PROFILE_ID }}
      IVORIS_USERNAME: ${{ secrets.IVORIS_USERNAME }}
      IVORIS_PASSWORD: ${{ secrets.IVORIS_PASSWORD }}
      IVORIS_RELAY_HOST: ${{ secrets.IVORIS_RELAY_HOST }}
      IVORIS_PATIENTS_PATH: ${{ secrets.IVORIS_PATIENTS_PATH }}
      IVORIS_PATIENTS_METHOD: ${{ secrets.IVORIS_PATIENTS_METHOD }}
      IVORIS_MANDANT_INDEX: ${{ secrets.IVORIS_MANDANT_INDEX }}
      ANIMASIGN_SYNC_WORKER_PATIENT_LIMIT: "25"
      ANIMASIGN_SYNC_WORKER_DOCUMENT_LIMIT: "25"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify live schema compatibility
        run: npm run check:schema

      - name: Repair legacy false-green states
        run: npm run repair:animasign-false-greens

      - name: Run AnimaSign sync worker
        run: npm run animasign:sync-worker

      - name: Repair legacy signed PDF paths
        run: npm run repair:animasign-signed-paths -- --apply --limit=120

      - name: Verify AnimaSign integrity
        id: integrity
        # Known/manual data findings remain visible in the incident, but are not
        # a new infrastructure failure on every ten-minute worker run.
        continue-on-error: true
        run: npm run check:animasign

      - name: Run AnimaSign supervisor
        id: supervisor
        if: always()
        continue-on-error: true
        run: npm run check:animasign-supervisor

      - name: Create or update staffed P0 incident
        if: failure() || steps.integrity.outcome == 'failure' || steps.supervisor.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          INCIDENT_TITLE: "[P0] AnimaSign/Anima-Scribe Betriebscheck rot"
        run: |
          issue_number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$INCIDENT_TITLE in:title" --json number,title --jq '.[] | select(.title == env.INCIDENT_TITLE) | .number' | head -n 1)"
          incident_body="$(printf 'Der automatische AnimaSign/Anima-Scribe-Betriebscheck ist rot. Es existiert mindestens ein ungeklärter Integritäts-, Synchronisations- oder Infrastrukturfehler.\n\nLetzter Lauf: https://github.com/%s/actions/runs/%s\n\nNötige Aktion: Lauf öffnen, fehlerhafte Stufe prüfen und den Fall erst nach Rücklesebeweis oder bewusster manueller Auflösung schließen.' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          if [ -z "$issue_number" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$INCIDENT_TITLE" --body "$incident_body" --assignee "$GITHUB_REPOSITORY_OWNER"
          fi

      - name: Close recovered P0 incident
        if: success() && steps.integrity.outcome == 'success' && steps.supervisor.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          INCIDENT_TITLE: "[P0] AnimaSign/Anima-Scribe Betriebscheck rot"
        run: |
          issue_number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$INCIDENT_TITLE in:title" --json number,title --jq '.[] | select(.title == env.INCIDENT_TITLE) | .number' | head -n 1)"
          if [ -n "$issue_number" ]; then
            gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY" --comment "Der Betriebscheck ist wieder grün. Das Incident wird automatisch geschlossen."
          fi
