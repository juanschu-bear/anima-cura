name: Production Verify

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    # Playwright 1.60 supports Ubuntu 24.04; ubuntu-latest has moved to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Verify authenticated invoice access in PostgreSQL
        run: node scripts/test-patient-invoice-authenticated.mjs

      - name: Install Chromium for patient browser regression tests
        run: npx playwright install --with-deps chromium

      - name: Verify patient portal and login in browser
        run: npm run test:patient-portal-ui

      - name: Tests
        run: npm run test

      - name: Verify live production schema
        run: npm run check:schema

      - name: Verify AnimaSign integrity
        # Live data findings are handled by the scheduled supervisor. They must
        # not turn every otherwise healthy deployment commit red.
        continue-on-error: true
        run: npm run check:animasign
